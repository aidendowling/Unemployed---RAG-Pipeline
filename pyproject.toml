[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unemployed-rag-pipeline"
version = "0.1.0"
description = "Baseline Python project scaffold for the Unemployed RAG Pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"duckdb>=1.0.0",
	"pandas>=2.2.0",
	"pyarrow>=16.0.0",
	"chromadb>=0.5.0",
	"sentence-transformers>=3.0.0",
	"rank-bm25>=0.2.2",
	"openai>=1.0.0",
	"python-dotenv>=1.0.0",
]

[project.optional-dependencies]
eval = [
	"ragas>=0.2.0",
	"datasets>=2.19.0",
]
dev = [
	"pytest>=7.0.0",
	"pytest-cov>=4.0.0",
	"ruff>=0.1.0",
	"mypy>=1.0.0",
]

[project.scripts]
unemployed-rag-pipeline = "unemployed_rag_pipeline.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unemployed_rag_pipeline = ["ingestion/layouts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
